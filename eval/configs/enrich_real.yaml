# Enrichment-step attack on the real snapshot with a pinned Ollama model (about 40-60 min).
#   uv run python -m eval.enrich_attack all --config eval/configs/enrich_real.yaml --out-dir results_enrich
# Copy the model name and digest from models.lock.yaml (pin-models) or from real1.yaml.
name: enrich_real
snapshot: "data/raw/snapshot.yaml"
models:
  - {name: "llama3.1:8b", kind: ollama, digest: "46e0c10c039e019119339687c3c1757cc81b9da49709a3b3924863ba87ca666e"}
defenses: [none, prompt_hardening, detector, taintguard]
knowledge: [blackbox]
n_complaints: 24
split: test
out_dir: results
n_boot: 1000
