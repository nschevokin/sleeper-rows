[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taintguard"
version = "0.1.0"
description = "Lineage-based taint tracking and agent-boundary guard for LLM agents that read warehouse data."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["sqlglot>=30.25,<31", "pydantic>=2.7", "pyyaml>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/taintguard"]
